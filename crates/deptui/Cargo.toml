[package]
name = "deptui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A terminal UI wrapper around serokell/deploy-rs"

[lib]
name = "deptui"
path = "src/lib.rs"

[[bin]]
name = "deptui"
path = "src/main.rs"

[dependencies]
deptui-core = { path = "../deptui-core" }
anyhow.workspace = true
clap.workspace = true
# `event-stream` for the async key/tick source in src/event.rs.
crossterm = { version = "0.29", features = ["event-stream"] }
# `StreamExt::next` for crossterm's EventStream (src/event.rs) — the
# executor/compat layers in the default feature set are unused.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc.workspace = true
# `unstable-rendered-line-info` gives `Paragraph::line_count`, which is
# ratatui's own word-wrapper answering "how many rows does this line
# render as". The scroll maths used a `Line::width()/pane_width`
# estimate instead — but the word-wrapper moves a too-long-for-the-
# remainder token (a /nix/store/… path, say) wholly onto the next row,
# so the estimate undercounted and the tail's newest rows were clipped
# below the viewport (the Shift+V-at-the-bottom bug).
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
