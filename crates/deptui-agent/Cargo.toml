[package]
name = "deptui-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Background auto-deploy daemon for deptui: watches a git repo and pushes updates to configured hosts via deploy-rs"

[[bin]]
name = "deptui-agent"
path = "src/main.rs"

[dependencies]
deptui-core = { path = "../deptui-core" }
anyhow.workspace = true
libc.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# Config file format.
toml = "0.8"
# Control API over the Unix socket (and the optional TCP kick/status
# mirror). axum 0.8's `serve` accepts a `tokio::net::UnixListener`
# directly.
axum = "0.8"
# SSE log tail: adapts the broadcast channel into a Stream.
tokio-stream = { version = "0.1", features = ["sync"] }
# Cron-expression schedules ("*/15 * * * * *"); plain durations are
# parsed by hand in config.rs.
cron = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Webhook notifications (ntfy / generic JSON POST). rustls so we don't
# link the system openssl.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile.workspace = true
libc.workspace = true
