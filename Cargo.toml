[workspace]
resolver = "2"
members = ["crates/deptui-core", "crates/deptui", "crates/deptui-agent"]

[workspace.package]
version = "0.7.1"
edition = "2021"
license = "MIT"

# Shared dependency versions. Members opt in with `dep.workspace = true`
# so a version bump happens in exactly one place.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# Only the runtime pieces the binaries actually touch. `full` also pulls
# in `signal` and the rest, which is build time and API surface we never
# use.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "net",
    "sync",
    "time",
    "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
serial_test = "3"

# Profiles only apply at the workspace root; member profile sections are
# silently ignored.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
